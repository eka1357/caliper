[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper"
version = "0.1.0"
description = "Measure physical quantities in video instead of guessing them"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "openai>=1.66",            # Responses API support; used against https://api.meta.ai/v1
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "opencv-python-headless>=4.10",
  "meta-sam-parser",         # SAM 3.1 stream parsing and mask decoding (Meta docs)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
fallback = ["modal>=0.64", "huggingface_hub>=0.24"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["caliper*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
